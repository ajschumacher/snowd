name: Update snow data and deploy site

on:
  schedule:
    # Every hour, at an uncommon minute — in the hope of a real check every
    # three or four.
    #
    # GitHub queues scheduled workflows on a shared pool, starts them late and
    # drops them under load. At "23 */3" (eight slots a day), 15 of 37 slots
    # fired over this repo's first five days, anywhere from 16 minutes to
    # nearly 3 hours late, leaving gaps of up to 13 hours — long enough to
    # miss a morning report until the afternoon. The slots can't be made
    # reliable from in here, so there are more of them.
    #
    # Extra runs cost nothing: a report with the same numbers on the same day
    # is the same row, so a run with nothing new writes nothing and commits
    # nothing. (A lift or trail count that moved is something new, and updates
    # that row.) Even if every slot fired, that is one page view an hour per
    # resort.
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # commit new data rows
  pages: write      # publish the site
  id-token: write   # required by deploy-pages

# Never let two runs fetch and push at once.
concurrency:
  group: snowd-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Self-checks
        run: python scripts/test_snowd.py

      - name: Fetch snow reports
        run: python scripts/fetch.py

      - name: Commit new rows
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data.js
          if git diff --staged --quiet; then
            echo "No new data to commit."
            # still pick up anything pushed since this run was queued
            git pull --rebase --autostash origin main
          else
            git commit -m "data: snow reports $(date -u +'%Y-%m-%d %H:%M') UTC"
            # another run may have landed while we were fetching
            git pull --rebase --autostash origin main
            git push
          fi

      # The site is packaged here, from this job's working tree, rather than
      # from a fresh checkout in the deploy job. The fetch leaves behind
      # site/status.js — when it ran and what it couldn't read — which is
      # never committed (it changes on every run, and a run that finds nothing
      # new is supposed to commit nothing). Packaging here is what gets it
      # onto the site anyway, so the page can say when it last checked.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Deploys in the same run as the fetch on purpose: a commit pushed with
  # GITHUB_TOKEN does not trigger workflows, so a separate push-triggered
  # Pages workflow would never see the data the fetch just committed.
  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
