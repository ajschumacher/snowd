name: Fetch snow reports

on:
  schedule:
    # 14:00 UTC ≈ 07:00 Mountain — after resorts post their morning report.
    # GitHub's scheduler is best-effort and can run late or skip entirely; the
    # fetcher de-duplicates, so an extra or a missed run is harmless either way.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-snow
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Self-checks
        run: python scripts/test_snowd.py

      - name: Fetch snow reports
        run: python scripts/fetch.py

      - name: Commit new rows
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data.js
          if git diff --staged --quiet; then
            echo "No new data."
          else
            git commit -m "data: snow reports $(date -u +%Y-%m-%d)"
            git push
          fi
